name: Tests

on:
  push:

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: &php-versions ['8.2', '8.3', '8.4', '8.5', '8.6']

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, dom, json, mbstring, tokenizer, xml, xmlwriter, fileinfo
          coverage: none

      - uses: ./.github/actions/composer-install

      - run: ./vendor/bin/parallel-lint . --exclude ./vendor


  phpunit:
    name: Unit test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: *php-versions

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, dom, json, mbstring, tokenizer, xml, xmlwriter, fileinfo
          coverage: none

      - uses: ./.github/actions/composer-install

      - run: ./vendor/bin/phpunit
