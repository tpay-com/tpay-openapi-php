name: Pull request

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: none, curl, dom, mbstring, simplexml, tokenizer, xml, xmlwriter, json, fileinfo
          coverage: none

      - run: composer install --no-dev

      - run: chmod 777 -R vendor

      - run: git archive --output=tpay-openapi-php.zip HEAD

      - run: zip -ur tpay-openapi-php vendor/

      - run: mkdir sdk && unzip tpay-openapi-php.zip -d sdk

      - uses: actions/upload-artifact@v7
        id: sdk-upload
        with:
          name: 'tpay-openapi-php'
          path: 'sdk/'

      # GITHUB_TOKEN is read-only for PRs from forks, so commenting would fail there
      - uses: mshick/add-pr-comment@v3
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          message: |
            Tpay OpenAPI SDK - ${{ steps.sdk-upload.outputs.artifact-url }}

